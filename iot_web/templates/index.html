<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ESP32 智能网关监控</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f8;
            text-align: center;
        }


        h1 {
            margin-top: 40px;
            color: #333;
        }


        .container {

            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;

        }


        .card {

            background: white;
            width: 180px;
            height: 130px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            padding: 20px;

        }


        .title {

            font-size: 20px;
            color: #666;

        }


        .value {

            margin-top: 20px;

            font-size: 36px;

            color: #007bff;

            font-weight: bold;

        }


        .unit {

            font-size: 16px;

            color:#999;

        }


        #status {

            margin-top:30px;

            color:green;

        }


        .led-card {

            height: auto;
            min-height: 180px;

        }


        .led-circle {

            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ccc;
            margin: 10px auto;
            transition: background 0.3s, box-shadow 0.3s;

        }


        .led-circle.on {

            background: #00e676;
            box-shadow: 0 0 18px #00e676;

        }


        .led-circle.off {

            background: #555;

        }


        .led-label {

            display: block;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
            color: #666;

        }


        .led-btn {

            background: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;

        }


        .led-btn:hover {

            background: #0056b3;

        }


        .led-btn:active {

            background: #004494;

        }


    </style>

</head>


<body>


<h1>
    ESP32 + CH32 环境监测系统
</h1>


<div class="container">


    <div class="card">

        <div class="title">
            温度
        </div>

        <div class="value" id="temperature">
            --
        </div>

        <div class="unit">
            ℃
        </div>

    </div>



    <div class="card">

        <div class="title">
            湿度
        </div>

        <div class="value" id="humidity">
            --
        </div>

        <div class="unit">
            %
        </div>

    </div>



    <div class="card">

        <div class="title">
            光照ADC
        </div>

        <div class="value" id="light_adc">
            --
        </div>

        <div class="unit">
            ADC
        </div>

    </div>



    <div class="card">

        <div class="title">
            光照电压
        </div>

        <div class="value" id="light_mv">
            --
        </div>

        <div class="unit">
            mV
        </div>

    </div>



    <div class="card led-card">

        <div class="title">
            LED 控制
        </div>

        <div class="led-circle" id="ledCircle"></div>

        <span class="led-label" id="ledLabel">OFF</span>

        <button class="led-btn" id="ledBtn" onclick="toggleLED()">
            点击切换
        </button>

    </div>



</div>


<div id="status">

    等待MQTT数据...

</div>



<script>


// 连接Flask-SocketIO

const socket = io();



socket.on("connect",()=>{


    console.log("WebSocket连接成功");


    document.getElementById("status").innerHTML =
        "网页已连接";


});




// 接收服务器推送的数据

socket.on(
    "sensor_data",
    function(data){


        console.log(
            "收到数据:",
            data
        );


        document.getElementById(
            "temperature"
        ).innerHTML =
            data.temperature;



        document.getElementById(
            "humidity"
        ).innerHTML =
            data.humidity;



        document.getElementById(
            "light_adc"
        ).innerHTML =
            data.light_adc;



        document.getElementById(
            "light_mv"
        ).innerHTML =
            data.light_mv;



        document.getElementById(
            "status"
        ).innerHTML =
            "数据更新成功";


    }

);



socket.on(
    "disconnect",
    ()=>{


        document.getElementById(
            "status"
        ).innerHTML =
        "服务器断开";


    }
);



let ledState = false;

function toggleLED() {

    ledState = !ledState;

    if (ledState) {

        document.getElementById("ledCircle").className = "led-circle on";
        document.getElementById("ledLabel").innerHTML = "ON";
        socket.emit("led_control", { command: "ON" });

    } else {

        document.getElementById("ledCircle").className = "led-circle off";
        document.getElementById("ledLabel").innerHTML = "OFF";
        socket.emit("led_control", { command: "OFF" });

    }

    console.log("LED:", ledState ? "ON" : "OFF");
}



socket.on("led_status", function(data) {

    if (data.state === "ON") {

        ledState = true;
        document.getElementById("ledCircle").className = "led-circle on";
        document.getElementById("ledLabel").innerHTML = "ON";

    } else {

        ledState = false;
        document.getElementById("ledCircle").className = "led-circle off";
        document.getElementById("ledLabel").innerHTML = "OFF";

    }

});



</script>


</body>

</html>
